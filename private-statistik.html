<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bilder zusammenfügen – Nutzungsstatistik</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#101014; color:#f3f3f6; }
    body { max-width:620px; margin:3rem auto; padding:0 1rem; }
    .card { background:#1b1b21; border:1px solid #35353d; border-radius:16px; padding:1.25rem; }
    label { display:block; margin:.9rem 0 .35rem; color:#c9c9d1; }
    input,button { box-sizing:border-box; width:100%; padding:.85rem; border-radius:9px; font:inherit; }
    input { color:inherit; background:#101014; border:1px solid #454550; }
    button { margin-top:1rem; border:0; background:#0a84ff; color:white; font-weight:650; cursor:pointer; }
    .count { font-size:clamp(2rem,10vw,3.5rem); font-weight:750; margin:.5rem 0; overflow-wrap:anywhere; }
    .muted { color:#a5a5b0; line-height:1.5; }
    #result { margin-top:1rem; }
  </style>
</head>
<body>
  <h1>Bilder zusammenfügen</h1>
  <section class="card">
    <h2>Private Nutzungsstatistik</h2>
    <p class="muted">Die Seite selbst ist öffentlich erreichbar. Zählerdaten werden nur mit dem richtigen Admin-Schlüssel angezeigt. Den Schlüssel nicht in GitHub-Dateien eintragen.</p>
    <label for="key">Admin-Schlüssel</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="Dein BILDER_ADMIN_KEY">
    <button id="load">Zählerstand abrufen</button>
    <div id="result" aria-live="polite" class="muted"></div>
  </section>
  <script>
    const endpoint = "https://lqfplicjfqmtehffqhjw.supabase.co/functions/v1/bilder-zaehler";
    document.getElementById("load").addEventListener("click", async () => {
      const key = document.getElementById("key").value;
      const result = document.getElementById("result");
      result.textContent = "Lade Statistik …";
      try {
        const response = await fetch(endpoint, {
          method: "GET",
          headers: { "x-admin-key": key },
          cache: "no-store"
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(response.status === 401 ? "Admin-Schlüssel stimmt nicht." : (data.error || "Abruf fehlgeschlagen."));
        }
        result.replaceChildren();
        const count = document.createElement("div");
        count.className = "count";
        count.textContent = Number(data.aufrufe).toLocaleString("de-DE") + " Aufrufe";
        const updated = document.createElement("p");
        updated.className = "muted";
        updated.textContent = "Zuletzt aktualisiert: " + new Date(data.zuletzt_aktualisiert).toLocaleString("de-DE");
        result.append(count, updated);
      } catch (error) {
        result.textContent = "Fehler: " + error.message + ". Bitte Verbindung, CORS und Admin-Schlüssel prüfen.";
      }
    });
  </script>
</body>
</html>
